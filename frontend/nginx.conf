server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 60m;

    # DNS interne de Docker, relu toutes les 10 s. Sans cela, nginx résout « api » une seule
    # fois au démarrage : après un redémarrage du conteneur api (nouvelle IP), toutes les
    # requêtes échouaient en 502 « API hors ligne » jusqu'au redémarrage du frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # Indispensable pour le flux SSE du chat : pas de mise en tampon
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
